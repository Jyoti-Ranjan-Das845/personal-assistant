<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Architecture of the personal assistant: the person outside, talking to the chief of staff inside the system; the decision path, the code guards, the record and upkeep">
  <title>Personal assistant: architecture</title>
  <style>
    .t1 { font-size: 14px; font-weight: 600; fill: #1A2130; }
    .t2 { font-size: 12px; fill: #586274; }
    .tl { font-family: ui-monospace, Menlo, monospace; font-size: 12px; font-weight: 500; fill: #586274; letter-spacing: .04em; }
    .agent { fill: #EDEBFB; stroke: #5747C2; stroke-width: 1.25; }
    .store { fill: #E1F3EF; stroke: #0D7765; stroke-width: 1.25; }
    .code { fill: #E8ECF1; stroke: #48556B; stroke-width: 1.25; }
    .person { fill: #FBEEDD; stroke: #A9590F; stroke-width: 1.5; }
    .edge { fill: none; stroke: #586274; stroke-width: 1.4; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#586274"/>
    </marker>
  </defs>

  <rect width="1000" height="720" fill="#FFFFFF"/>

  <!-- the person, outside the system -->
  <rect class="person" x="420" y="20" width="160" height="50" rx="8"/>
  <text class="t1" x="500" y="41" text-anchor="middle">You</text>
  <text class="t2" x="500" y="59" text-anchor="middle">final say</text>

  <!-- the system -->
  <rect x="15" y="100" width="970" height="560" rx="14" fill="none" stroke="#586274" stroke-width="1.25" stroke-dasharray="6 6"/>
  <text class="tl" x="32" y="124">THE PERSONAL ASSISTANT</text>

  <!-- edges -->
  <path class="edge" d="M500 72 V212" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <path class="edge" d="M500 270 V448" marker-end="url(#ah)"/>
  <path class="edge" d="M600 242 H738" marker-end="url(#ah)"/>
  <path class="edge" d="M800 270 L762 316" marker-end="url(#ah)"/>
  <path class="edge" d="M860 270 L896 316" marker-end="url(#ah)"/>
  <path class="edge" d="M755 366 V448" marker-end="url(#ah)"/>
  <path class="edge" d="M900 366 V448" marker-end="url(#ah)"/>
  <path class="edge" d="M400 242 H262" marker-end="url(#ah)"/>
  <path class="edge" d="M185 588 V562" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <path class="edge" d="M390 588 V562" marker-end="url(#ah)"/>
  <path class="edge" d="M595 588 V562" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <path class="edge" d="M270 616 H298" marker-end="url(#ah)"/>
  <path class="edge" d="M510 616 H482" marker-end="url(#ah)"/>

  <!-- rules -->
  <rect class="code" x="90" y="140" width="200" height="48" rx="8"/>
  <text class="t1" x="190" y="160" text-anchor="middle">Constitution</text>
  <text class="t2" x="190" y="178" text-anchor="middle">+ a charter per agent</text>

  <!-- the main agents -->
  <rect class="agent" x="90" y="214" width="170" height="56" rx="8"/>
  <text class="t1" x="175" y="237" text-anchor="middle">Analyst</text>
  <text class="t2" x="175" y="256" text-anchor="middle">research + legwork</text>

  <rect class="agent" x="400" y="214" width="200" height="56" rx="8"/>
  <text class="t1" x="500" y="237" text-anchor="middle">Chief of staff</text>
  <text class="t2" x="500" y="256" text-anchor="middle">talks, sizes, briefs</text>

  <rect class="code" x="740" y="214" width="180" height="56" rx="8"/>
  <text class="t1" x="830" y="237" text-anchor="middle">decide tool</text>
  <text class="t2" x="830" y="256" text-anchor="middle">fixed path, in code</text>

  <rect class="agent" x="690" y="318" width="130" height="48" rx="8"/>
  <text class="t1" x="755" y="338" text-anchor="middle">Advisor</text>
  <text class="t2" x="755" y="356" text-anchor="middle">your judgment</text>

  <rect class="agent" x="835" y="318" width="130" height="48" rx="8"/>
  <text class="t1" x="900" y="338" text-anchor="middle">Challenger</text>
  <text class="t2" x="900" y="356" text-anchor="middle">second opinion</text>

  <!-- code guards -->
  <rect x="40" y="398" width="920" height="30" rx="6" fill="#E3E8EF" stroke="#48556B" stroke-width="1.25"/>
  <text class="tl" x="500" y="417" text-anchor="middle">CODE GUARDS · stakes floors · context assembly · permission rules · quarantine · logs</text>

  <!-- the record -->
  <rect x="40" y="450" width="920" height="110" rx="12" fill="none" stroke="#0D7765" stroke-width="1.25"/>
  <text class="tl" x="56" y="471">THE RECORD · one source of truth, kept in git</text>
  <rect class="store" x="60" y="482" width="140" height="60" rx="8"/>
  <text class="t1" x="130" y="508" text-anchor="middle">Core profile</text>
  <text class="t2" x="130" y="526" text-anchor="middle">values, red lines</text>
  <rect class="store" x="208" y="482" width="140" height="60" rx="8"/>
  <text class="t1" x="278" y="508" text-anchor="middle">Skills</text>
  <text class="t2" x="278" y="526" text-anchor="middle">one per area</text>
  <rect class="store" x="356" y="482" width="140" height="60" rx="8"/>
  <text class="t1" x="426" y="508" text-anchor="middle">Journal</text>
  <text class="t2" x="426" y="526" text-anchor="middle">choices, outcomes</text>
  <rect class="store" x="504" y="482" width="140" height="60" rx="8"/>
  <text class="t1" x="574" y="508" text-anchor="middle">Facts + people</text>
  <text class="t2" x="574" y="526" text-anchor="middle">dated, sourced</text>
  <rect class="store" x="652" y="482" width="140" height="60" rx="8"/>
  <text class="t1" x="722" y="508" text-anchor="middle">Precedents</text>
  <text class="t2" x="722" y="526" text-anchor="middle">case law</text>
  <rect class="store" x="800" y="482" width="140" height="60" rx="8"/>
  <text class="t1" x="870" y="508" text-anchor="middle">Raw inbox</text>
  <text class="t2" x="870" y="526" text-anchor="middle">untrusted</text>

  <!-- upkeep -->
  <rect class="agent" x="100" y="590" width="170" height="52" rx="8"/>
  <text class="t1" x="185" y="612" text-anchor="middle">Curator</text>
  <text class="t2" x="185" y="630" text-anchor="middle">weekly upkeep</text>
  <rect class="person" x="300" y="590" width="180" height="52" rx="8"/>
  <text class="t1" x="390" y="612" text-anchor="middle">You approve</text>
  <text class="t2" x="390" y="630" text-anchor="middle">every change</text>
  <rect class="agent" x="510" y="590" width="170" height="52" rx="8"/>
  <text class="t1" x="595" y="612" text-anchor="middle">Builder</text>
  <text class="t2" x="595" y="630" text-anchor="middle">new skills</text>

  <!-- runtime and legend -->
  <text class="tl" x="24" y="684">RUNTIME · Omnigent · every agent runs on Claude Code, on your own Claude plan</text>
  <g class="t2">
    <rect x="24" y="698" width="12" height="12" rx="3" class="agent"/><text x="42" y="708">Agent</text>
    <rect x="96" y="698" width="12" height="12" rx="3" class="store"/><text x="114" y="708">Memory</text>
    <rect x="178" y="698" width="12" height="12" rx="3" class="code"/><text x="196" y="708">Code or rules</text>
    <rect x="290" y="698" width="12" height="12" rx="3" class="person"/><text x="308" y="708">You</text>
  </g>
</svg>
